<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiskers Café</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        /* Navigation */
        nav {
            margin-top: 20px;
        }

        nav a {
            text-decoration: none;
            color: black;
            background-color: #d6cbb5;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            background-color: #c4b89f;
        }

        /* Image */
        .hero img {
            width: 60%;
            max-width: 600px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Our Cats</a>
        <a href="#">Menu</a>
        <a href="#">Book Visits</a>
        <a href="#">Rules</a>
    </nav>

    <!-- Image -->
    <div class="hero">
        <img src="cat.png" alt="Cat">
    </div>

</body>
</html>
