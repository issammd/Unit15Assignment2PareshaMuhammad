<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiskers Café</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        /* Navigation Bar */
        nav {
            margin-top: 20px;
        }

        nav a {
            text-decoration: none;
            color: black;
            background-color: #d6cbb5;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }

        nav a:hover {
            background-color: #c4b89f;
        }

        /* Main Image */
        .hero img {
            width: 60%;
            max-width: 600px;
            margin-top: 40px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            nav a {
                display: block;
                margin: 10px auto;
                width: 80%;
            }

            .hero img {
                width: 90%;
            }
